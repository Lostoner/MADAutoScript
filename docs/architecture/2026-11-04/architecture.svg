<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="982" viewBox="0 0 1600 982" role="img" aria-labelledby="title desc">
<title id="title">MAD 日常自动化：执行与存储</title><desc id="desc">从 GUI 或 CLI 启动 Main 和 MadThread。工作线程向 Scheduler 请求任务组，自行调用 module 处理器，通过 ADB 与本机 OCR 操作游戏。配置、调度时间和扫荡剩余次数与步骤断点分别保存。</desc>
<rect x="0" y="0" width="1600" height="982" rx="0" fill="#F6F7F4" stroke="none" stroke-width="1.5"/>
<rect x="54" y="41" width="6" height="88" rx="1" fill="#006E65" stroke="none" stroke-width="1.5"/>
<text x="79" y="65" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#006E65">MAD  /  架构基线</text>
<text x="77" y="125" font-family="Microsoft YaHei" font-size="48" font-weight="bold" fill="#162F38">一轮日常怎样执行，又怎样续跑？</text>
<text x="1258" y="62" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#162F38">0.7.5 开发工作树</text>
<text x="1258" y="99" font-family="Segoe UI" font-size="21" font-weight="normal" fill="#546C70">2026-11-04   /   Schema 6</text>
<polyline points="55,156 1545,156" fill="none" stroke="#CBD7D4" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="202" font-family="Microsoft YaHei" font-size="27" font-weight="bold" fill="#162F38">执行路径</text>
<text x="196" y="201" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#546C70">箭头表示调用或任务组的返回方向</text>
<text x="1110" y="202" font-family="Microsoft YaHei" font-size="27" font-weight="bold" fill="#162F38">持久化边界</text>
<polyline points="329,293 361,293" fill="none" stroke="#56716F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="365,293 354,287 354,299" fill="#56716F"/>
